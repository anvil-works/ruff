[package]
name = "anvil-ty-native"
version = "0.1.0-canary.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
anvil-ty-compat = { path = "../compat" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = { version = "0.4", default-features = false }
jsonc-parser = { version = "0.34.0", features = ["serde"] }
ruff_db = { path = "../../crates/ruff_db", features = ["os"] }
ruff_notebook = { path = "../../crates/ruff_notebook" }
ruff_python_ast = { path = "../../crates/ruff_python_ast" }
ruff_python_parser = { path = "../../crates/ruff_python_parser" }
ruff_ranged_value = { path = "../../crates/ruff_ranged_value" }
ruff_source_file = { path = "../../crates/ruff_source_file" }
ruff_text_size = { path = "../../crates/ruff_text_size" }
serde_json = "1"
serde_yaml = "0.9"
toml = { version = "1", default-features = false, features = ["display", "parse", "serde", "std"] }
ty_project = { path = "../../crates/ty_project" }
ty_module_resolver = { path = "../../crates/ty_module_resolver" }
ty_python_semantic = { path = "../../crates/ty_python_semantic" }
ty_site_packages = { path = "../../crates/ty_site_packages" }
ty_vendored = { path = "../../crates/ty_vendored" }
walkdir = "2"

[profile.release]
lto = "fat"
codegen-units = 16

[profile.release.package.ruff_python_parser]
codegen-units = 1

[profile.release.package.ruff_python_ast]
codegen-units = 1

[profile.release.package.salsa]
codegen-units = 1
